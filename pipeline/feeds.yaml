# Outlets Nazariya follows. Edit freely: add, remove, or set `enabled: false`.
# Run `python -m nazariya.check_feeds` after any change to confirm each feed
# responds and parses.
#
# Feed URLs were taken from publishers' published RSS links (checked against
# FeedSpot's Indian and Hindi news directories in Aug 2026). Entries marked
# "verify" come from older listings and are the most likely to need updating.
#
# `group` names the ownership group. Sister outlets that publish in both
# languages (NDTV / NDTV India, News18 / News18 Hindi, India Today / Aaj Tak...)
# are the most direct test of language framing: same newsroom owner, different
# audience. The app shows the group next to the outlet name.
#
# Choosing outlets is an editorial decision. The list deliberately spans
# ownership groups and editorial positions, and the app never labels outlets
# politically; it shows what each one published and lets readers compare.

