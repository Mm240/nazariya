    url: https://www.theguardian.com/world/rss
    homepage: https://www.theguardian.com/world

# Items whose URL contains any of these are skipped (galleries, videos, web stories).
skip_url_patterns:
  - /photos/
  - /photo-gallery/
  - /photogallery/
  - /videos/
  - /video/
  - /web-stories/
  - /webstories/
  - /web-story/
  - /visualstories/

# Items whose headline contains any of these (case-insensitive) are skipped.
skip_title_keywords:
  - horoscope
  - rashifal
  - राशिफल
  - panchang
  - पंचांग
