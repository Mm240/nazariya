  # ---------- World sections of outlets above ----------
  # `outlet:` attaches the feed to an existing outlet; `section: world` marks
  # its articles as international news (shown under the World tab).
  # Run `python -m nazariya.check_feeds` after adding feeds: URLs here marked
  # "verify" follow each site's published pattern but weren't tested from India.

  - slug: the-hindu-world
    outlet: the-hindu
    section: world
    name: The Hindu
    language: en
    url: https://www.thehindu.com/news/international/?service=rss

  - slug: indian-express-world
    outlet: indian-express
    section: world
    name: The Indian Express
    language: en
    url: https://indianexpress.com/section/world/feed/

  - slug: hindustan-times-world
    outlet: hindustan-times
    section: world
    name: Hindustan Times
    language: en
