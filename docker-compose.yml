# Local development: Postgres with pgvector, plus the API.
#   docker compose up -d
# Then run the pipeline and the web app on your machine (see README).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nazariya
      POSTGRES_PASSWORD: nazariya
      POSTGRES_DB: nazariya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazariya"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://nazariya:nazariya@db:5432/nazariya
      CORS_ORIGINS: http://localhost:5173
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
